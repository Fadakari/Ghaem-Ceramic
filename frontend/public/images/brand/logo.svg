<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5500" />
      <stop offset="50%" stop-color="#ff7700" />
      <stop offset="100%" stop-color="#ffa500" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Container: Alumina Hexagonal Micro-Crystal & Wear Plates -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="20" fill="url(#ceramicGrad)" filter="drop-shadow(0 6px 12px rgba(255, 85, 0, 0.35))" />
    
    <!-- Hexagonal / Isometric Ceramic Tile Layers -->
    <path d="M40 22 L62 33 L62 57 L40 68 L18 57 L18 33 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <path d="M40 22 L40 68" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.6" />
    <path d="M40 45 L62 33" stroke="#ffffff" stroke-width="2.5" />
    <path d="M40 45 L18 33" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="40" cy="45" r="4.5" fill="#ffffff" />
  </g>

  <!-- Brand Typography (Persian & English) -->
  <g transform="translate(105, 48)">
    <text font-family="Vazirmatn, Tahoma, sans-serif" font-weight="900" font-size="26" fill="#0f172a" direction="rtl">
      شرکت بهبود سرامیک
    </text>
  </g>
  <g transform="translate(105, 75)">
    <text font-family="'Courier New', monospace, sans-serif" font-weight="700" font-size="12" fill="#64748b" letter-spacing="3" text-transform="uppercase">
      BEHBOD CERAMIC INDUSTRY
    </text>
  </g>
</svg>
